name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cyber-strategy-ai/requirements.txt

      - name: Validate Python imports/syntax
        run: |
          python -m compileall cyber-strategy-ai/app

      - name: Smoke check app module
        run: |
          python -c "from app.main import app; print(app.title)"
        working-directory: cyber-strategy-ai
